name: Feature request
description: Propose an improvement to the observability or control workflow
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to observe, understand, or control today?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Describe the interaction from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: This can remain local-first or has an explicit privacy model.
          required: true
        - label: This does not require bypassing Codex approvals or sandboxing.
          required: true
