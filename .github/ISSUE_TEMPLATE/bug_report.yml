name: Bug report
description: Report a reproducible problem in WatchingCodex
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove project secrets, source code, tokens, and private command output before posting.
  - type: input
    id: version
    attributes:
      label: WatchingCodex version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: Output of codex --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, WSL]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: What did you do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized context
      description: Add relevant logs or screenshots after removing sensitive data.
